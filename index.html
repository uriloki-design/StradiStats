
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent !important;
  font-family: 'Montserrat', sans-serif;
}

#rr-widget {
  display: inline-block;
  width: 100%;
  max-width: 850px;
  color: white;
  background: transparent;
}

.panel {
  background: transparent;
  padding: 10px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 10px;
}

.brand {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  color: white;
  text-shadow: 0 2px 5px black;
}

.nick {
  color: #FF991C;
  font-size: 22px;
  margin-top: 5px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(255,153,28,.7),
               0 2px 5px black;
}

.live {
  font-size: 10px;
  color: #69dc91;
  font-weight: 900;
  text-shadow: 0 2px 5px black;
  white-space: nowrap;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 10px;
}

.stat {
  background: rgba(10,10,10,.35);
  border: 2px solid #FF991C;
  border-radius: 7px;
  padding: 12px 6px;
  text-align: center;
  box-shadow: 0 0 10px rgba(255,153,28,.25);
  min-width: 0;
}

.label {
  color: white;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.2px;
  text-shadow: 0 2px 4px black;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.number {
  font-size: clamp(21px,4vw,34px);
  font-weight: 900;
  margin-top: 7px;
  color: white;
  text-shadow: 0 2px 5px black;
  white-space: nowrap;
  overflow: hidden;
}

.gold {
  color: #FF991C;
}

.delta {
  display: inline-block;
  font-size: 12px;
  font-weight: 900;
  margin-left: 4px;
  white-space: nowrap;
  vertical-align: middle;
}

.positive {
  color: #69dc91;
  text-shadow: 0 0 7px rgba(105,220,145,.35);
}

.negative {
  color: #FF991C;
  text-shadow: 0 0 7px rgba(255,153,28,.35);
}

.neutral {
  color: #bbbbbb;
}

.footer {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  color: white;
  font-size: 9px;
  text-shadow: 0 2px 4px black;
  gap: 8px;
}

@media(max-width:480px) {
  .stats { gap: 5px; }
  .stat { padding: 10px 3px; }
  .label { font-size: 8px; }
  .nick { font-size: 18px; }
  .delta { font-size: 10px; margin-left: 2px; }
}
</style>
</head>

<body>

<div id="rr-widget">
  <div class="panel">

    <div class="header">
      <div>
        <div class="brand">RACEROOM RANKED</div>
        <div class="nick" id="rr-name">JAVIER SOTO</div>
      </div>
      <div class="live">● LIVE</div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="label">
          RATING
          <span class="delta neutral" id="rr-rating-delta">--</span>
        </div>
        <div>
          <span class="number gold" id="rr-rating">---</span>
        </div>
      </div>

      <div class="stat">
        <div class="label">
          REPUTACIÓN
          <span class="delta neutral" id="rr-rep-delta">--</span>
        </div>
        <div>
          <span class="number" id="rr-rep">---</span>
        </div>
      </div>

      <div class="stat">
        <div class="label">
          GLOBAL
          <span class="delta neutral" id="rr-position-delta">--</span>
        </div>
        <div>
          <span class="number" id="rr-position">---</span>
        </div>
      </div>

    </div>

    <div class="footer">
      <span id="rr-status">Conectando...</span>
      <span id="rr-time">--:--:--</span>
    </div>

  </div>
</div>

<script>
(() => {

  const PILOT_NICK = "stradivar";
  const FULL_NAME = "JAVIER SOTO";

  const API = "https://game.raceroom.com/multiplayer-rating/ratings.json";
  const INTERVAL = 60000;

  const $ = id => document.getElementById(id);

  let previous = null;

  const normalize = s => String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim();

  const cleanKey = s =>
    normalize(s).replace(/[^a-z0-9]/g,"");

  function getField(obj, aliases) {
    if (!obj || typeof obj !== "object") return null;

    for (const [key,value] of Object.entries(obj)) {
      if (
        aliases.includes(cleanKey(key)) &&
        value !== null &&
        value !== ""
      ) return value;
    }
    return null;
  }

  function num(value) {
    if (typeof value === "number") return value;

    if (typeof value === "string") {
      const n = Number(value.replace(",","."));
      return Number.isFinite(n) ? n : null;
    }

    return null;
  }

  function findPlayers(data) {

    const result = [];
    const visited = new WeakSet();

    const nameKeys = [
      "name","username","playername","drivername",
      "nickname","displayname","fullname"
    ];

    const ratingKeys = [
      "rating","rankedrating","mprating","elo","skillrating"
    ];

    const repKeys = [
      "reputation","rep","rankedreputation",
      "mpreputation","safetyrating"
    ];

    const posKeys = [
      "position","globalposition","globalrank",
      "worldrank","rank","place"
    ];

    function walk(node,depth) {

      if (
        !node ||
        typeof node !== "object" ||
        depth > 12 ||
        visited.has(node)
      ) return;

      visited.add(node);

      if (Array.isArray(node)) {
        node.forEach(x => walk(x,depth+1));
        return;
      }

      const name = getField(node,nameKeys);
      const username = getField(node,[
        "username","playername","drivername","nickname"
      ]);
      const fullname = getField(node,[
        "fullname","displayname"
      ]);

      const rating = num(getField(node,ratingKeys));
      const rep = num(getField(node,repKeys));
      const pos = num(getField(node,posKeys));

      if (
        (name != null || username != null || fullname != null) &&
        rating != null &&
        rep != null
      ) {
        result.push({
          name: String(name ?? username ?? fullname),
          username: username != null ? String(username) : null,
          fullname: fullname != null ? String(fullname) : null,
          rating,
          rep,
          pos
        });
      }

      Object.values(node).forEach(x => {
        if (x && typeof x === "object") {
          walk(x,depth+1);
        }
      });
    }

    walk(data,0);

    return result;
  }

  function findPilot(players) {
    return players.find(p => {

      const identifiers = [
        p.name,
        p.username,
        p.fullname
      ];

      return identifiers.some(
        value => value != null &&
        normalize(value) === normalize(PILOT_NICK)
      );
    });
  }

  function showDelta(id,current,old,inverted=false) {

    const element = $(id);

    if (old == null || current == null) {
      element.textContent = "--";
      element.className = "delta neutral";
      return;
    }

    const difference = inverted
      ? old - current
      : current - old;

    if (difference > 0) {
      element.textContent = "+" + difference.toLocaleString("es-ES");
      element.className = "delta positive";
    }
    else if (difference < 0) {
      element.textContent = difference.toLocaleString("es-ES");
      element.className = "delta negative";
    }
    else {
      element.textContent = "0";
      element.className = "delta neutral";
    }
  }

  async function update() {

    try {

      const response = await fetch(
        API + "?t=" + Date.now(),
        {cache:"no-store"}
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      const players = findPlayers(data);

      if (!players.length) {
        throw new Error("JSON no reconocido");
      }

      const pilot = findPilot(players);

      if (!pilot) {
        throw new Error("Piloto STRADIVAR no encontrado");
      }

      let position = pilot.pos;

      if (position == null) {

        const sorted = [...players].sort(
          (a,b) => b.rating-a.rating
        );

        position = sorted.indexOf(pilot) + 1;
      }

      $("rr-name").textContent = FULL_NAME;

      $("rr-rating").textContent =
        pilot.rating.toLocaleString("es-ES");

      $("rr-rep").textContent =
        pilot.rep.toLocaleString("es-ES");

      $("rr-position").textContent =
        position > 0 ? "#" + position : "---";

      showDelta(
        "rr-rating-delta",
        pilot.rating,
        previous?.rating
      );

      showDelta(
        "rr-rep-delta",
        pilot.rep,
        previous?.rep
      );

      showDelta(
        "rr-position-delta",
        position,
        previous?.position,
        true
      );

      previous = {
        rating: pilot.rating,
        rep: pilot.rep,
        position: position
      };

      $("rr-status").textContent = "Datos actualizados";

      $("rr-time").textContent =
        new Date().toLocaleTimeString("es-ES");

    } catch(error) {

      console.error("RaceRoom:",error);

      $("rr-status").textContent =
        "Error de conexión / CORS";
    }
  }

  update();
  setInterval(update,INTERVAL);

})();
</script>

</body>
</html>
